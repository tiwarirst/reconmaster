[mypy]
# ── ReconAI — Strict Type Checking Configuration ─────────────────────────────
# Enforces Tier-1 engineering standards across the entire codebase.
# Every module must pass mypy before merge.
python_version = 3.11
strict = false

# Core strictness flags (Tier-1 standard)
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

# ── Per-module overrides for third-party tools without stubs ──────────────────

# Playwright: optional dep — ignore at import level only
[mypy-playwright.*]
ignore_missing_imports = true

# Windows-only process group APIs are not on Windows stubs — use type:ignore inline
[mypy-reconai.core.executor.process_manager]
warn_return_any = false

