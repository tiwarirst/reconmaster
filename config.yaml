# ReconAI Default Configuration
# Customize this file and run: reconai scan example.com --config config.yaml

timeouts:
  dns_query: 10
  http_probe: 30
  nmap_quick: 60
  nmap_standard: 120
  subdomain_tool: 120
  default: 60

concurrency:
  dns: 20
  http: 20
  crawler: 10
  subdomain: 5

rate_limits:
  http: 20
  dns: 50
  crawler: 10

scan_limits:
  max_depth: 2
  max_pages: 500
  max_urls: 5000

output:
  base_dir: "output"
  save_raw: true
  save_normalized: true
  save_logs: true
  report_formats: ["html", "json", "md"]

cache:
  enabled: true
  ttl_dns: 3600
  ttl_http: 1800

# Optional API Keys (Not required for core functionality)
api_keys:
  shodan: ""
  virustotal: ""
